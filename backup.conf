# PS5Save configuration
# Settings reload automatically at each backup pass.
# Invalid values are logged and ignored; missing settings use built-in defaults.

# Delay between backup passes (int, min 30 max 3600)
backup_interval_seconds=600

# Enable decrypted PS4 save backups (false, true)
backup_ps4_saves=true

# Enable decrypted PS5 save backups (false, true)
backup_ps5_saves=true

# Maximum combined save-image size per title (int)
# Decimal MB: 1 MB = 1,000,000 bytes. 4096 MB = 4.096 GB.
# Existing size bounds: 64..65536 MB.
max_title_size_mb=4096

# Number of dated snapshots retained; 0 means disabled (int)
# Existing retention bounds: 0..10.
daily_snapshots_to_keep=3

# Optional additional files/directories; directories recurse automatically.
# /data/PCSX2/Mcd001.ps2
# /data/porpoise/saves/
